# Replace YOURUSER and the worker URL (see README, "Editor setup").
backend:
  name: github
  repo: YOURUSER/akanksh-site
  branch: main
  base_url: https://akanksh-auth.YOURSUBDOMAIN.workers.dev
  auth_endpoint: auth
publish_mode: editorial_workflow   # Draft -> In review -> Ready (opens a PR; merge = publish)
media_folder: public/uploads
public_folder: /akanksh-site/uploads
collections:
  - name: writing
    label: Writing
    folder: src/content/writing
    extension: md
    create: true
    slug: "{{slug}}"
    fields: &common
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: category, label: Category, widget: string, default: General }
      - { name: body, label: Body, widget: markdown }
  - name: projects
    label: Projects
    folder: src/content/projects
    extension: md
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: tech, label: Technologies, widget: list, required: false }
      - { name: repo, label: Repo URL, widget: string, required: false }
      - { name: demo, label: Demo URL, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }
  - name: timeline
    label: Timeline
    folder: src/content/timeline
    extension: md
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: text }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: link, label: "Link to entry (e.g. /writing/slug)", widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }
  - name: reading
    label: Reading log
    folder: src/content/reading
    extension: md
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: author, label: Author, widget: string }
      - { name: status, label: Status, widget: select, options: [want, reading, finished] }
      - { name: rating, label: Rating, widget: number, min: 1, max: 5, required: false }
      - { name: summary, label: Summary, widget: text }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
      - { name: body, label: Body, widget: markdown }
  - name: logs
    label: Motorcycle posts
    folder: src/content/logs
    extension: md
    create: true
    fields: *common
  - name: fuel
    label: Fuel log
    files:
      - label: Fuel fill-ups
        name: fuel
        file: src/data/fuel.json
        fields:
          - { name: sample, label: Sample data (turn off when real), widget: boolean, default: false }
          - name: fills
            label: Fill-ups
            widget: list
            fields:
              - { name: date, label: "Date (YYYY-MM-DD)", widget: string }
              - { name: odometer, label: Odometer (km), widget: number }
              - { name: distance, label: Distance since last fill (km), widget: number }
              - { name: mileage, label: Mileage over that distance (km/l), widget: number, value_type: float }
              - { name: litres, label: Litres filled, widget: number, value_type: float }
              - { name: cost, label: Cost (INR), widget: number, value_type: float }
              - { name: bunk, label: Petrol bunk name, widget: string, required: false }
              - { name: fuel, label: Petrol type (e.g. Regular / Premium), widget: string, required: false }
          - name: other_costs
            label: Other costs (chain lube, service, etc.)
            widget: list
            required: false
            fields:
              - { name: date, label: "Date (YYYY-MM-DD)", widget: string }
              - { name: item, label: What was it, widget: string }
              - { name: cost, label: Cost (INR), widget: number, value_type: float }
  - name: photos
    label: Photos
    folder: src/content/photos
    extension: md
    create: true
    media_folder: /public/photos
    public_folder: /akanksh-site/photos
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: image, label: Image, widget: image }
      - { name: alt, label: Alt text, widget: string }
      - { name: caption, label: Caption, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, default: true }
